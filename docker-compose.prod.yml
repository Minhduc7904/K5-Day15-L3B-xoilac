# Lớp phủ cho VPS: chạy cùng docker-compose.yml.
#   docker compose --env-file /opt/examind/prod.env -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Chỉ nginx mở cổng ra ngoài (80 và 443). Postgres, MinIO và backend chỉ nghe trên 127.0.0.1 hoặc mạng nội bộ compose.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    image: examind-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-examind}:${POSTGRES_PASSWORD:?thiếu POSTGRES_PASSWORD trong prod.env}@postgres:5432/${POSTGRES_DB:-examind}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?thiếu S3_ACCESS_KEY trong prod.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?thiếu S3_SECRET_KEY trong prod.env}
      S3_BUCKET: ${S3_BUCKET:-examind}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${LETSENCRYPT_DIR:-/opt/examind/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-/opt/examind/certbot-www}:/var/www/certbot:ro
    # Nạp lại cấu hình mỗi 6 giờ để nginx dùng chứng chỉ vừa được certbot gia hạn.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  # Gia hạn chứng chỉ Let's Encrypt tự động (kiểm tra mỗi 12 giờ, chỉ gia hạn khi còn dưới 30 ngày).
  # Xin chứng chỉ lần đầu do deploy/remote-deploy.sh làm, dùng chung hai thư mục với nginx.
  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    volumes:
      - ${LETSENCRYPT_DIR:-/opt/examind/letsencrypt}:/etc/letsencrypt
      - ${CERTBOT_WEBROOT:-/opt/examind/certbot-www}:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *logging

  postgres:
    restart: unless-stopped
    logging: *logging

  minio:
    restart: unless-stopped
    logging: *logging
