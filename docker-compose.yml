# Hạ tầng: PostgreSQL + MinIO và hai container init chạy một lần rồi thoát.
#   - db-init:    alembic upgrade head, rồi nạp dữ liệu nền nếu có $SEED_DIR (một lần)
#   - minio-init: tạo bucket, rồi nạp ảnh nền nếu có $SEED_DIR (một lần)
# Local: backend/frontend chạy trực tiếp trên máy (docs/operations/run-local-stack.md).
# VPS:   thêm docker-compose.prod.yml (backend + nginx), xem docs/operations/deploy-backend-ci-cd.md.
# Giá trị mặc định chỉ dùng cho máy dev; đổi bằng biến môi trường hoặc --env-file.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examind}
      POSTGRES_DB: ${POSTGRES_DB:-examind}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO không còn đăng bản mới trên Docker Hub (minio/minio đã bị gỡ) và quay.io trả 401 khi không đăng nhập.
  # Dùng bản đóng băng bitnamilegacy (MinIO 2025.5.24) cho dev và demo. Đổi image khi nhóm chốt nguồn khác.
  minio:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ""
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-init:
    build: ./backend
    image: examind-backend:latest
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-examind}:${POSTGRES_PASSWORD:-examind}@postgres:5432/${POSTGRES_DB:-examind}
      SEED_DIR: /seed
    volumes:
      - ${SEED_DIR:-./data/private/seed}:/seed:ro
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_load.py"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio-init:
    image: bitnamilegacy/minio-client:latest
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-examind}
    volumes:
      - ./deploy/minio-init.sh:/init.sh:ro
      - ${SEED_DIR:-./data/private/seed}:/seed:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  miniodata:
