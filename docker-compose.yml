# Hạ tầng chạy local: PostgreSQL + MinIO, hai container init chạy xong rồi thoát.
# Backend và frontend chạy trực tiếp trên máy (xem docs/guides/local-setup.md).
# Giá trị mặc định chỉ dùng cho máy dev; đổi bằng biến môi trường hoặc file .env cạnh file này.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examind}
      POSTGRES_DB: ${POSTGRES_DB:-examind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO không còn đăng bản mới trên Docker Hub (minio/minio đã bị gỡ) và quay.io trả 401 khi không đăng nhập.
  # Dùng bản đóng băng bitnamilegacy (MinIO 2025.5.24) cho môi trường dev. Đổi image khi nhóm chốt nguồn khác.
  minio:
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ""
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Chạy một lần: tạo bảng bằng Alembic rồi thoát.
  db-init:
    build: ./backend
    image: examind-backend:dev
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-examind}:${POSTGRES_PASSWORD:-examind}@postgres:5432/${POSTGRES_DB:-examind}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Chạy một lần: tạo bucket nếu chưa có rồi thoát (idempotent).
  minio-init:
    image: bitnamilegacy/minio-client:latest
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-examind}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY
      && mc mb --ignore-existing local/$$S3_BUCKET"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  miniodata:
