# Reverse proxy cho VPS. Sửa file này rồi merge vào main: CI/CD kiểm cú pháp (nginx -t),
# deploy lên VPS và reload nginx tự động.
#
# Cổng 80:  API (HTTP, dùng cho kiểm sức khoẻ) và thử thách ACME của Let's Encrypt.
# Cổng 443: cùng các location, mã hoá bằng chứng chỉ Let's Encrypt (xem deploy/remote-deploy.sh).
# Các location dùng chung nằm ở locations.inc (đuôi .inc để nginx không tự nạp như file cấu hình).

server_tokens off;

# Header bảo mật áp dụng cho mọi phản hồi.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# DNS nội bộ của Docker. Phân giải `backend` lúc chạy nên nginx vẫn khởi động được
# khi backend chưa sẵn sàng và `nginx -t` chạy được ở CI.
resolver 127.0.0.11 valid=10s ipv6=off;

# Có header Upgrade thì nâng lên WebSocket, không có thì giữ kết nối thường (Socket.IO còn dùng long-polling).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    # Let's Encrypt xác minh quyền sở hữu tên miền qua đường dẫn này. Thư mục dùng chung với container certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    include /etc/nginx/conf.d/locations.inc;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name examind.duckdns.org;

    # Chứng chỉ do certbot cấp và gia hạn. Lần deploy đầu có chứng chỉ tạm tự ký để nginx khởi động được.
    ssl_certificate     /etc/letsencrypt/live/examind.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/examind.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50m;

    include /etc/nginx/conf.d/locations.inc;
}
