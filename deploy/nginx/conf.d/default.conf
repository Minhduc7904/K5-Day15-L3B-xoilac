# Reverse proxy cho VPS. Sửa file này rồi merge vào main: CI/CD kiểm cú pháp (nginx -t),
# deploy lên VPS và reload nginx tự động.

server_tokens off;

# DNS nội bộ của Docker. Phân giải `backend` lúc chạy nên nginx vẫn khởi động được
# khi backend chưa sẵn sàng và `nginx -t` chạy được ở CI.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API và tài liệu tự sinh của FastAPI.
    location ~ ^/(api/|docs|redoc|openapi\.json) {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        # SSE (issue #4): không gom bộ đệm để sự kiện đến ngay.
        proxy_buffering off;
    }

    location / {
        default_type text/plain;
        return 404 "Examind: dung /api/v1/health de kiem tra backend.\n";
    }
}
