# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 100
  base: 500
  high: 2000
  source: "(tự ước tính) chưa có số học sinh thật của trung tâm nên 3 mốc là giả định của nhóm: 100 (vài lớp), 500 (cả trung tâm), 2.000 (vài trung tâm). Mốc tham chiếu công khai: cả nước có 2.993.731 học sinh THPT năm học 2023-2024 (https://giaoduc.net.vn/gdvn-post244337.gd) nên mốc cao ≈ 0,07% học sinh THPT"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: on_rai_rac
    share: 0.5              # tỉ lệ người dùng kiểu này
    uses_per_month: 1       # số phiên / người / tháng
    turns_per_session: 2    # số lượt hỏi trong một phiên
    source: "số phiên: khảo sát câu 8, 8/14 phiếu có nêu số lần ôn 1 lần/tháng (evidence/survey/results.csv); tỉ lệ 0,5 và 2 lượt/phiên (yêu cầu + xác nhận) là (tự ước tính)"
  - name: on_deu
    share: 0.3
    uses_per_month: 2.5
    turns_per_session: 3
    source: "số phiên: khảo sát câu 8, 6/14 phiếu ôn 2–3 lần/tháng, lấy giữa khoảng 2,5; tỉ lệ 0,3 và 3 lượt/phiên (yêu cầu, chỉnh bằng lời, xác nhận như B01–B03) là (tự ước tính)"
  - name: on_don_truoc_ky_thi
    share: 0.2
    uses_per_month: 4
    turns_per_session: 4
    source: "(tự ước tính) khảo sát không hỏi riêng nhóm ôn dồn trước kỳ thi; 4 phiên/tháng và 4 lượt/phiên là giả định, tách 0,2 từ hai nhóm trên"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "https://developers.openai.com/api/docs/pricing · xem 25/11/2026 (model nhóm đã đo token thật)"
  - model: gpt-5-nano
    input: 0.05
    output: 0.40
    source: "https://developers.openai.com/api/docs/pricing · xem 25/11/2026 (mức rẻ hơn; chưa chạy eval trên model này)"
  - model: gpt-6.2-sol
    input: 2.00
    output: 10.00
    source: "https://developers.openai.com/api/docs/pricing · xem 25/11/2026 (mức mạnh hơn; chưa chạy eval trên model này)"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
